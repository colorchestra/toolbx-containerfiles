stages:
  - build
variables:
  CONTAINER_REGISTRY: "registry.gitlab.com"

before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CONTAINER_REGISTRY

build:
  stage: build
  script:
    - build() { cd "$*" || exit 1; docker build -f Containerfile -t "${CONTAINER_REGISTRY}/${CI_PROJECT_PATH}/$*:latest" . && docker push "${CONTAINER_REGISTRY}/${CI_PROJECT_PATH}/$*:latest" ; cd .. ; }
    - build_image homebox
    - build_image signal-desktop
    - build_image youtube-dl
    - build_image cloud-tools
  tags:
    - docker-build