stages:
  - build
variables:
  CONTAINER_REGISTRY: "registry.gitlab.com"

before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CONTAINER_REGISTRY
  - |
      build() { 
        cd "$*" || exit 1
        docker build -f Containerfile -t "${CONTAINER_REGISTRY}/${CI_PROJECT_PATH}/$*:latest" .
        docker push "${CONTAINER_REGISTRY}/${CI_PROJECT_PATH}/$*:latest"
        cd ..
      }

build:
  stage: build
  script:
    - build homebox
    - build signal-desktop
    - build youtube-dl
    - build cloud-tools
  tags:
    - docker-build