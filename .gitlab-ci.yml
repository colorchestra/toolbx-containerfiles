stages:
  - build
variables:
  CONTAINER_REGISTRY: "registry.gitlab.com"

before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CONTAINER_REGISTRY

build:
  stage: build
  script:
    - cd homebox
    - docker build -f Containerfile -t $CONTAINER_REGISTRY/$CI_PROJECT_PATH/homebox:latest .
    - docker push $CONTAINER_REGISTRY/$CI_PROJECT_PATH/homebox:latest
    - cd ../cloud-tools
    - docker build -f Containerfile -t $CONTAINER_REGISTRY/$CI_PROJECT_PATH/cloud-tools:latest .
    - docker push $CONTAINER_REGISTRY/$CI_PROJECT_PATH/cloud-tools:latest
  tags:
    - docker-build